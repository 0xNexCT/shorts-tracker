name: SMM Auto-Like Check (15 min)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SMM auto-like check endpoint
        run: |
          curl "https://shorts-tracker-seven.vercel.app/api/cron/check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -f -s -S
