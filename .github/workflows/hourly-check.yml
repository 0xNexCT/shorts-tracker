name: Hourly Shorts Check
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hourly check endpoint
        run: |
          curl "https://shorts-tracker-seven.vercel.app/api/cron/hourly" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -f -s -S